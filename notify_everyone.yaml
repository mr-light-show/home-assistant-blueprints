blueprint:
  name: Notify everyone
  description: Notify people at home (and optional always-notify list) via Companion app.
  domain: script
  source_url: https://github.com/mr-light-show/home-assistant-blueprints
  input:
    person_service_map:
      name: Person notify services
      description: >
        Add each household member and their mobile app device. Also supports
        legacy YAML map form, e.g. john: notify.mobile_app_john
      selector:
        object:
          label_field: person
          description_field: notify_device
          multiple: true
          fields:
            person:
              label: Person
              required: true
              selector:
                entity:
                  filter:
                    - domain: person
            notify_device:
              label: Mobile app device
              required: true
              selector:
                device:
                  integration: mobile_app
            notify_entity:
              label: Notify entity (optional)
              description: >
                Use instead of device if you have notify.* entities (HA 2024+).
                Leave empty to derive notify.mobile_app_* from the device name.
              required: false
              selector:
                entity:
                  filter:
                    - domain: notify

mode: parallel

fields:
  people_to_always_notify:
    name: People to always notify
    description: Notify these people even when not home.
    required: false
    selector:
      entity:
        filter:
          - domain: person
        multiple: true
  people:
    name: People at home
    description: >
      Only consider these people for home presence. Leave empty to use everyone
      configured in Person notify services.
    required: false
    selector:
      entity:
        filter:
          - domain: person
        multiple: true
  message:
    name: Message
    required: true
    selector:
      text:
        multiline: true
  group:
    name: Group
    description: Notification group / tag
    required: true
    selector:
      text:
  title:
    name: Title
    required: false
    selector:
      text:
  subtitle:
    name: SubTitle
    required: false
    selector:
      text:
  sound:
    name: Sound
    required: false
    selector:
      text:
    default: Ladder.caf
  url:
    name: URL
    description: Relative dashboard URL, e.g. /lovelace/home
    required: false
    selector:
      text:

sequence:
  - variables:
      person_service_map: !input person_service_map
      notify_targets: >-
        {% set ns = namespace(targets=[]) %}
        {% if person_service_map is mapping %}
          {% for slug, target in person_service_map.items() %}
            {% set ns.targets = ns.targets + [{'slug': slug, 'notify': target}] %}
          {% endfor %}
        {% else %}
          {% for row in person_service_map %}
            {% set slug = row.person.split('.')[1] %}
            {% if row.notify_entity is defined and row.notify_entity %}
              {% set target = row.notify_entity %}
            {% else %}
              {% set dev_name = device_attr(row.notify_device, 'name') %}
              {% set target = 'notify.mobile_app_' + (dev_name | slugify) %}
            {% endif %}
            {% set ns.targets = ns.targets + [{'slug': slug, 'notify': target}] %}
          {% endfor %}
        {% endif %}
        {{ ns.targets }}
      people_slugs: >-
        {% set configured = notify_targets | map(attribute='slug') | list %}
        {% if people is string %}
          {% set picked = [people.split('.')[1]] %}
        {% elif people is iterable and people is not mapping and people | count > 0 %}
          {% set picked = people | map('regex_replace', '^person\\.', '') | list %}
        {% elif people is mapping and people | count > 0 %}
          {% set picked = people.keys() | list %}
        {% else %}
          {% set picked = configured %}
        {% endif %}
        {{ picked }}
      always_slugs: >-
        {% if people_to_always_notify is string %}
          {{ [people_to_always_notify.split('.')[1]] }}
        {% elif people_to_always_notify is iterable and people_to_always_notify is not mapping %}
          {{ people_to_always_notify | map('regex_replace', '^person\\.', '') | list }}
        {% elif people_to_always_notify is mapping %}
          {{ people_to_always_notify.keys() | list }}
        {% else %}
          {{ [] }}
        {% endif %}
      notify_actions: >-
        {% set ns = namespace(actions=[]) %}
        {% for row in notify_targets %}
          {% if row.slug in always_slugs and row.notify not in ns.actions %}
            {% set ns.actions = ns.actions + [row.notify] %}
          {% endif %}
        {% endfor %}
        {% for row in notify_targets %}
          {% if row.slug in people_slugs
             and is_state('person.' ~ row.slug, 'home')
             and row.notify not in ns.actions %}
            {% set ns.actions = ns.actions + [row.notify] %}
          {% endif %}
        {% endfor %}
        {{ ns.actions }}

  - repeat:
      for_each: "{{ notify_actions }}"
      sequence:
        - choose:
            - conditions:
                - condition: template
                  value_template: >-
                    {{ repeat.item.startswith('notify.')
                       and states(repeat.item) not in ['unknown', 'unavailable', none] }}
              sequence:
                - action: notify.send_message
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    title: "{{ title | default('') }}"
                    message: "{{ message }}"
                    data:
                      group: "{{ group }}"
                      tag: "{{ group }}"
                      subtitle: "{{ subtitle | default('') }}"
                      subject: "{{ subtitle | default('') }}"
                      url: "{{ url | default('') }}"
                      clickAction: "{{ url | default('') }}"
                      push:
                        interruption-level: active
                        sound: "{{ sound | default('Ladder.caf') }}"
            default:
              - action: "{{ repeat.item }}"
                data:
                  title: "{{ title | default('') }}"
                  message: "{{ message }}"
                  data:
                    group: "{{ group }}"
                    tag: "{{ group }}"
                    subtitle: "{{ subtitle | default('') }}"
                    subject: "{{ subtitle | default('') }}"
                    url: "{{ url | default('') }}"
                    clickAction: "{{ url | default('') }}"
                    push:
                      interruption-level: active
                      sound: "{{ sound | default('Ladder.caf') }}"
