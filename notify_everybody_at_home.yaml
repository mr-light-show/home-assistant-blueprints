blueprint:
  name: Notify everyone
  description: Notify people at home (and optional always-notify list) via mobile_app actions.
  domain: script
  source_url: https://github.com/mr-light-show/home-assistant-blueprints
  input:
    person_service_map:
      name: Person notify services
      description: >
        Map each person slug (must match person.<slug>) to the notify action,
        e.g. john: notify.mobile_app_john
      selector:
        object: {}
      default:
        john: notify.mobile_app_john

mode: restart

fields:
  people_to_always_notify:
    name: People to always notify
    description: >
      Person slugs to notify even when not home. YAML list ["keith"] or object
      keith: null (legacy UI format). Leave empty for none.
    required: false
    selector:
      object: {}
  people:
    name: People at home
    description: >
      Subset to check for home. Leave empty to use all keys from Person notify
      services. YAML list or object keith: null (legacy).
    required: false
    selector:
      object: {}
  message:
    name: Message
    required: true
    selector:
      text:
        multiline: true
  group:
    name: Group
    description: Notification group / tag
    required: true
    selector:
      text:
  title:
    name: Title
    required: false
    selector:
      text:
  subtitle:
    name: SubTitle
    required: false
    selector:
      text:
  sound:
    name: Sound
    required: false
    selector:
      text:
    default: Ladder.caf
  url:
    name: URL
    description: Relative dashboard URL, e.g. /lovelace/home
    required: false
    selector:
      text:

sequence:
  - variables:
      person_service_map: !input person_service_map
      notify_actions: >-
        {% set pmap = person_service_map %}
        {% set people_list = people.keys() | list if people is mapping
           else people | default(pmap.keys() | list, true) | list %}
        {% set always_list = people_to_always_notify.keys() | list if people_to_always_notify is mapping
           else people_to_always_notify | default([], true) | list %}
        {% set ns = namespace(actions=[]) %}
        {% for p in always_list %}
          {% if p in pmap and pmap[p] not in ns.actions %}
            {% set ns.actions = ns.actions + [pmap[p]] %}
          {% endif %}
        {% endfor %}
        {% for p in people_list %}
          {% if is_state('person.' ~ p, 'home') and p in pmap and pmap[p] not in ns.actions %}
            {% set ns.actions = ns.actions + [pmap[p]] %}
          {% endif %}
        {% endfor %}
        {{ ns.actions }}

  - repeat:
      for_each: "{{ notify_actions }}"
      sequence:
        - action: "{{ repeat.item }}"
          data:
            title: "{{ title | default('') }}"
            message: "{{ message }}"
            data:
              group: "{{ group }}"
              tag: "{{ group }}"
              subtitle: "{{ subtitle | default('') }}"
              subject: "{{ subtitle | default('') }}"
              url: "{{ url | default('') }}"
              clickAction: "{{ url | default('') }}"
              push:
                interruption-level: active
                sound: "{{ sound | default('Ladder.caf') }}"
